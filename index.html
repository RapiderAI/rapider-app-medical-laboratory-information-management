<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Medical Laboratory Information Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "orders-accessioning": "pages/orders-accessioning/orders-accessioning.html",
  "critical-readbacks": "pages/critical-readbacks/critical-readbacks.html",
  "bench-worklists": "pages/bench-worklists/bench-worklists.html",
  "analyzer-runs": "pages/analyzer-runs/analyzer-runs.html",
  "specimen-storage": "pages/specimen-storage/specimen-storage.html",
  "qc-westgard": "pages/qc-westgard/qc-westgard.html",
  "diagnostic-reports": "pages/diagnostic-reports/diagnostic-reports.html",
  "test-compendium": "pages/test-compendium/test-compendium.html",
  "lab-order-detail": "pages/lab-order-detail/lab-order-detail.html",
  "test-definition-detail": "pages/test-definition-detail/test-definition-detail.html",
  "report-signout-detail": "pages/report-signout-detail/report-signout-detail.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
